<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Экспонат — Музей тренажёров Кегеля</title>
  <meta name="description" content="Экспонат музея тренажёров Кегеля: описание и принцип действия.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/img/logo.svg">
</head>
<body data-page="museum">
  <div data-header style="height:99px"></div>

  <main data-museum-item>
    <section class="b-hero">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Хлебные крошки"><a href="museum.html">Музей Кегеля</a><span>/</span><span data-item-section>Экспонат</span></nav>
        <div class="b-hero__grid">
          <div class="b-hero__media" style="--g:var(--g-rose)">
            <div class="b-hero__plate"></div>
            <div class="b-hero__photo m-item__photo m-item__photo--real" data-item-photos></div>
          </div>
          <div>
            <p class="b-hero__author" data-item-kicker>Экспонат музея</p>
            <h1 class="display b-hero__title" data-item-name>Экспонат</h1>
            <p class="b-hero__text" data-item-lead></p>
            <div class="b-hero__actions">
              <a class="btn" href="bos.html#formats" data-booking="diag">Подобрать на диагностике <span class="arr">→</span></a>
              <a class="btn btn--ghost" href="museum.html">Все экспонаты <span class="arr">→</span></a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="about-book">
          <div class="about-book__text" data-item-blocks></div>
          <dl class="specs" data-item-specs></dl>
        </div>
        <p class="placeholder-note" style="margin-top:20px">Материалы музея носят справочный характер и не заменяют консультацию специалиста.</p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <p class="eyebrow" style="margin-bottom:16px">Соседние экспонаты</p>
        <div class="m-grid m-grid--near" data-item-near></div>
      </div>
    </section>
  </main>

  <div data-footer></div>
  <script src="js/museum-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
